
<!DOCTYPE html>

<style>
 
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Times New Roman",serif;

body{
display:flex;

width:380px;

<body>
 
<div class="telefono">
 
<div class="onda1"></div>
<div class="onda2"></div>
 
<div class="contenido">
 
<h2>DATOS PERSONALES Y DOCUMENTOS DEL CONDUCTOR</h2>
<p class="subtitulo">Sube fotos claras y legibles de tus documentos.</p>
 
<form id="formConductor">
 
<label class="campo" for="celular">Número de celular</label>
<input type="tel" id="celular" name="celular" autocomplete="tel" required>
 
<div class="documentos" id="documentos"></div>
 
<div id="errorVer" role="alert" style="display:none;color:#b00;text-align:center;font-size:14px;margin:0 0 10px;"></div>
 
<button type="submit">SIGUIENTE</button>
 
</form>
 
</div>
 
</div>
 
<script>
 
const documentos = [
  { id: "cedula_frente", nombre: "Cédula (parte delantera)" },
  { id: "cedula_atras",  nombre: "Cédula (parte trasera)" },
  { id: "licencia",      nombre: "Licencia de Conducción" },
  { id: "soat",          nombre: "SOAT vigente" },
  { id: "revision",      nombre: "Revisión técnico-mecánica" },
  { id: "moto_frente",   nombre: "Mototaxi (parte delantera)" },
  { id: "moto_atras",    nombre: "Mototaxi (parte trasera, con la placa)" }
];
 
const iconoMas = '<svg viewBox="0 0 24 24"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>';
const iconoCamara = '<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
 
const fotos = {};        // fotos guardadas (reducidas) por documento
const pendientes = {};   // procesos de reducción en curso
let documentoCedula = ""; // número de documento leído de la foto de la cédula
let placaLeida = "";      // placa leída de la foto trasera del mototaxi
let tokenCedula = 0, tokenPlaca = 0;
let textosCedula = [];   // texto leído de la cédula (delantera y, si hizo falta, trasera)
let ocrFallo = false;     // true si no se pudo cargar/usar el lector de imágenes
const archivos = {};      // archivo original elegido por documento

function cargarTesseract(){
  return new Promise(function(ok, fallo){
    if (window.Tesseract) return ok(window.Tesseract);
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload = function(){ ok(window.Tesseract); };
    sc.onerror = fallo;
    document.head.appendChild(sc);
  });
}

function imagenParaOCR(archivo){
  return new Promise(function(ok){
    const lector = new FileReader();
    lector.onload = function(){
      const img = new Image();
      img.onload = function(){
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.92));
      };
      img.onerror = function(){ ok(null); };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

function extraerNumero(texto){
  let m = texto.match(/N[UÚ]MERO[^\d]{0,15}(\d[\d.,' ]{5,16}\d)/i);
  if (!m) m = texto.match(/\b(\d{1,3}(?:[.,]\d{3}){2,3})\b/);
  if (m) {
    const d = m[1].replace(/\D/g, "");
    if (d.length >= 6 && d.length <= 10) return d;
  }
  const todos = texto.match(/\d{6,10}/g) || [];
  todos.sort(function(x, y){ return y.length - x.length; });
  return todos[0] || "";
}

function leerTextoCedula(archivo){
  return Promise.all([cargarTesseract(), imagenParaOCR(archivo)]).then(function(r){
    if (!r[1]) return "";
    return r[0].recognize(r[1], "spa").then(function(res){ return res.data.text || ""; });
  }).catch(function(){ ocrFallo = true; return ""; });
}

// ---------- Verificación: el nombre de la cuenta debe ser el de la cédula ----------
const PALABRAS_IGNORADAS = ["DE","DEL","LA","LAS","LOS","Y","APELLIDOS","NOMBRES","NOMBRE","COLOMBIA","REPUBLICA","CEDULA","CIUDADANIA","NUMERO","FIRMA","IDENTIFICACION","PERSONAL"];
function normalizar(s){
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z\s]/g, " ").replace(/\s+/g, " ").trim();
}
function distancia(a, b){
  const d = [];
  for (let i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (let j = 1; j <= b.length; j++) { d[0][j] = j; }
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  }
  return d[a.length][b.length];
}
// Devuelve { ok, msg }. Tolera pequeños errores de lectura de la foto (1-2 letras)
function verificarNombre(nombreCuenta, textoCedula){
  const palabrasCedula = normalizar(textoCedula).split(" ").filter(function(w){ return w.length >= 3; });
  if (palabrasCedula.join("").length < 20) {
    return { ok:false, msg: ocrFallo
      ? "No pudimos leer la cédula (revisa tu conexión a internet e inténtalo de nuevo)."
      : "No pudimos leer tu cédula. Sube una foto más clara y completa de la parte delantera." };
  }
  const nombres = normalizar(nombreCuenta).split(" ").filter(function(t){
    return t.length >= 2 && PALABRAS_IGNORADAS.indexOf(t) === -1;
  });
  if (nombres.length < 2) {
    return { ok:false, msg:"Tu nombre de registro debe ser el nombre completo, tal como aparece en la cédula." };
  }
  let coinciden = 0;
  nombres.forEach(function(t){
    const tol = t.length >= 8 ? 2 : (t.length >= 4 ? 1 : 0);
    if (palabrasCedula.some(function(w){ return Math.abs(w.length - t.length) <= tol && distancia(w, t) <= tol; })) coinciden++;
  });
  if (coinciden >= Math.max(2, Math.ceil(nombres.length * 0.75))) return { ok:true, msg:"" };
  return { ok:false, msg:"El nombre de tu cuenta (" + nombreCuenta + ") no coincide con el de la cédula. La información debe ser la misma." };
}
 

function aLetra(c){ return ({"0":"O","1":"I","5":"S","8":"B","2":"Z","6":"G"})[c] || c; }
function aDigito(c){ return ({"O":"0","Q":"0","D":"0","I":"1","L":"1","S":"5","B":"8","Z":"2","G":"6"})[c] || c; }

// Placas colombianas: 3 letras + 3 números (ABC-123) o 3 letras + 2 números + 1 letra (ABC-12D, motos)
// Devuelve todas las placas posibles que aparecen en el texto, con cuántas letras hubo que corregir
function extraerPlacas(texto){
  // Palabras sueltas en orden de lectura; una placa es una palabra de 6-7 caracteres (ABC123)
  // o 2-3 palabras seguidas con forma 3+3, 3+2 o 3+2+1 (ABC 123 / ABC 12 D)
  const p = texto.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  const candidatos = [];
  for (let i = 0; i < p.length; i++) {
    if (p[i].length === 6 || p[i].length === 7) {
      for (let k = 0; k + 6 <= p[i].length; k++) candidatos.push(p[i].substr(k, 6));
    }
    if (p[i].length === 3 && p[i+1] && (p[i+1].length === 3 || p[i+1].length === 2)) {
      candidatos.push(p[i] + p[i+1]);
      if (p[i+1].length === 2 && p[i+2] && p[i+2].length === 1) candidatos.push(p[i] + p[i+1] + p[i+2]);
    }
  }
  const halladas = {};
  candidatos.forEach(function(w){
    if (w.length !== 6) return;
    let costo = 0, ok = true, r = "";
    for (let k = 0; k < 3 && ok; k++) {
      const x = /[A-Z]/.test(w[k]) ? w[k] : aLetra(w[k]);
      if (!/[A-Z]/.test(x)) ok = false; else { if (x !== w[k]) costo++; r += x; }
    }
    for (let k = 3; k < 5 && ok; k++) {
      const x = /\d/.test(w[k]) ? w[k] : aDigito(w[k]);
      if (!/\d/.test(x)) ok = false; else { if (x !== w[k]) costo++; r += x; }
    }
    if (!ok || costo > 1) return;
    r += w[5];
    const placa = r.substr(0, 3) + "-" + r.substr(3);
    if (halladas[placa] === undefined || costo < halladas[placa]) halladas[placa] = costo;
  });
  return Object.keys(halladas).map(function(k){ return { placa:k, costo:halladas[k] }; });
}

// Prepara varias versiones de la foto (contraste, blanco y negro, recorte ampliado) para que el lector vea mejor la placa
function crearVariantes(url){
  return new Promise(function(ok){
    const img = new Image();
    img.onerror = function(){ ok([]); };
    img.onload = function(){
      function lienzo(sx, sy, sw, sh, escala){
        const c = document.createElement("canvas");
        c.width = Math.round(sw * escala); c.height = Math.round(sh * escala);
        c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        return c;
      }
      function filtrar(c, blancoNegro){
        const x = c.getContext("2d"), d = x.getImageData(0, 0, c.width, c.height), p = d.data;
        const n = p.length / 4, g = new Uint8Array(n), h = new Array(256).fill(0);
        for (let i = 0; i < n; i++) { const v = Math.round(0.299*p[4*i] + 0.587*p[4*i+1] + 0.114*p[4*i+2]); g[i] = v; h[v]++; }
        let acc = 0, lo = 0, hi = 255;
        for (let v = 0; v < 256; v++) { acc += h[v]; if (acc >= n * 0.02) { lo = v; break; } }
        acc = 0;
        for (let v = 255; v >= 0; v--) { acc += h[v]; if (acc >= n * 0.02) { hi = v; break; } }
        if (hi <= lo) { lo = 0; hi = 255; }
        const h2 = new Array(256).fill(0);
        for (let i = 0; i < n; i++) { g[i] = Math.max(0, Math.min(255, Math.round((g[i] - lo) * 255 / (hi - lo)))); h2[g[i]]++; }
        let umbral = -1;
        if (blancoNegro) {            // umbral de Otsu
          let suma = 0; for (let v = 0; v < 256; v++) suma += v * h2[v];
          let sB = 0, wB = 0, mejor = 0;
          for (let v = 0; v < 256; v++) {
            wB += h2[v]; if (!wB) continue;
            const wF = n - wB; if (!wF) break;
            sB += v * h2[v];
            const mB = sB / wB, mF = (suma - sB) / wF, var_ = wB * wF * (mB - mF) * (mB - mF);
            if (var_ > mejor) { mejor = var_; umbral = v; }
          }
        }
        for (let i = 0; i < n; i++) {
          const v = umbral >= 0 ? (g[i] > umbral ? 255 : 0) : g[i];
          p[4*i] = p[4*i+1] = p[4*i+2] = v; p[4*i+3] = 255;
        }
        x.putImageData(d, 0, 0);
        return c.toDataURL("image/png");
      }
      const w = img.width, h = img.height;
      const bn = filtrar(lienzo(0, 0, w, h, 1), true);
      ok([
        { url: filtrar(lienzo(0, 0, w, h, 1), false), psm: "11" },
        { url: bn, psm: "11" },
        { url: bn, psm: "6" },
        { url: filtrar(lienzo(w*0.15, h*0.15, w*0.7, h*0.7, Math.min(2, 1600 / (w*0.7))), false), psm: "11" }
      ]);
    };
    img.src = url;
  });
}

// Lee la placa de la foto: varias pasadas y se queda con la que más se repite
function leerPlaca(archivo){
  return Promise.all([cargarTesseract(), imagenParaOCR(archivo)]).then(function(r){
    if (!r[1]) return "";
    return Promise.all([r[0].createWorker("eng"), crearVariantes(r[1])]).then(function(x){
      const w = x[0], variantes = x[1], votos = {};
      let confirmada = "";
      return variantes.reduce(function(p, v){
        return p.then(function(){
          if (confirmada) return;      // dos lecturas iguales y sin correcciones: ya es segura
          return w.setParameters({ tessedit_pageseg_mode: v.psm, tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789" })
            .then(function(){ return w.recognize(v.url); })
            .then(function(res){
              extraerPlacas(res.data.text || "").forEach(function(c){
                const e = votos[c.placa] || (votos[c.placa] = { n:0, costo:9 });
                e.n++; e.costo = Math.min(e.costo, c.costo);
                if (e.n >= 2 && e.costo === 0) confirmada = c.placa;
              });
            }).catch(function(){});
        });
      }, Promise.resolve()).then(function(){
        return w.terminate().catch(function(){});
      }).then(function(){
        if (confirmada) return confirmada;
        let mej = null;
        Object.keys(votos).forEach(function(k){
          const e = votos[k];
          if (!mej || e.n > votos[mej].n || (e.n === votos[mej].n && e.costo < votos[mej].costo)) mej = k;
        });
        return mej || "";
      });
    });
  }).catch(function(){ ocrFallo = true; return ""; });
}

function comprimir(archivo){
  return new Promise(function(ok){
    const lector = new FileReader();
    lector.onload = function(){
      const img = new Image();
      img.onload = function(){
        const k = Math.min(1, 700 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = function(){ ok(null); };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}
 

// Lee el número de la cédula: primero la parte delantera y, si no se logra, la trasera
function procesarCedula(){
  const token = ++tokenCedula;
  const estadoF = document.querySelector('input[name="cedula_frente"]').closest(".doc").querySelector(".estado");
  documentoCedula = "";
  textosCedula = [];
  ocrFallo = false;
  if (archivos.cedula_frente) estadoF.textContent = "Leyendo cédula…";
  const frente = archivos.cedula_frente ? leerTextoCedula(archivos.cedula_frente) : Promise.resolve("");
  pendientes.cedula_ocr = frente.then(function(tf){
    // si en la parte delantera no se lee el número, se intenta con la trasera
    if (extraerNumero(tf) || !archivos.cedula_atras) return [tf, ""];
    return leerTextoCedula(archivos.cedula_atras).then(function(ta){ return [tf, ta]; });
  }).then(function(t){
    if (token !== tokenCedula) return;
    textosCedula = t;
    documentoCedula = extraerNumero(t[0]) || extraerNumero(t[1]);
    if (archivos.cedula_frente) estadoF.textContent = "Foto cargada ✓";
  });
}

// Lee la placa de la foto trasera del mototaxi automáticamente
function procesarPlaca(estado){
  const token = ++tokenPlaca;
  placaLeida = "";
  estado.textContent = "Leyendo placa…";
  pendientes.placa_ocr = leerPlaca(archivos.moto_atras).then(function(p){
    if (token !== tokenPlaca) return;
    placaLeida = p;
    estado.textContent = p ? "Foto cargada ✓ Placa: " + p : "No se detectó la placa: sube otra foto";
  });
}
 
const contenedor = document.getElementById("documentos");
 
documentos.forEach(function(d){
  const label = document.createElement("label");
  label.className = "doc";
  label.innerHTML =
    '<span class="mas">' + iconoMas + '</span>' +
    '<span class="texto">' +
      '<span class="nombre">' + d.nombre + '</span>' +
      '<span class="estado">Subir Foto</span>' +
    '</span>' +
    '<span class="camara">' + iconoCamara + '</span>' +
    '<input type="file" name="' + d.id + '" accept="image/*" required>';
 
  const input = label.querySelector("input");
  const estado = label.querySelector(".estado");
  input.addEventListener("change", function(){
    if (!input.files.length) return;
    archivos[d.id] = input.files[0];
    label.classList.add("listo");
    estado.textContent = "Foto cargada ✓";
    pendientes[d.id] = comprimir(input.files[0]).then(function(url){ fotos[d.id] = url; });

    if (d.id === "cedula_frente" || d.id === "cedula_atras") procesarCedula();
    if (d.id === "moto_atras") procesarPlaca(estado);
  });
 
  contenedor.appendChild(label);
});
 
document.getElementById("formConductor").addEventListener("submit", function(e){
  e.preventDefault();
  const boton = document.querySelector('#formConductor button[type="submit"]');
  const error = document.getElementById("errorVer");
  error.style.display = "none";
  boton.disabled = true; boton.textContent = "VERIFICANDO…";
  Promise.all(Object.values(pendientes)).then(function(){
    const cuenta = TUK.cuenta() || {};
    const v = verificarNombre(cuenta.nombre || "", textosCedula.join(" "));
    function rechazar(msg, conEnlace){
      error.innerHTML = "";
      error.appendChild(document.createTextNode(msg + " "));
      if (conEnlace) {
        const enlace = document.createElement("a");
        enlace.href = "registro.html"; enlace.textContent = "Corregir mi registro";
        enlace.style.color = "#b00";
        error.appendChild(enlace);
      }
      error.style.display = "block";
      error.scrollIntoView({ behavior:"smooth", block:"center" });
      boton.disabled = false; boton.textContent = "SIGUIENTE";
    }
    if (!v.ok) return rechazar(v.msg, true);          // no se crea el perfil
    if (!placaLeida) return rechazar(ocrFallo
      ? "No pudimos leer la placa (revisa tu conexión a internet e inténtalo de nuevo)."
      : "No pudimos leer la placa en la foto trasera del mototaxi. Sube otra foto, de frente, con buena luz y la placa bien visible.", false);
    try {
      localStorage.setItem("tuk_docs", JSON.stringify(fotos));
      localStorage.setItem("tuk_datos", JSON.stringify({
        documento: documentoCedula,
        verificado: true,
        celular: document.getElementById("celular").value
      }));
      // Placa: se guarda en los datos del vehículo, que es lo que muestra el perfil
      let veh = {};
      try { veh = JSON.parse(localStorage.getItem("tuk_vehiculo") || "{}"); } catch(e2){}
      veh.placa = placaLeida;
      localStorage.setItem("tuk_vehiculo", JSON.stringify(veh));
      localStorage.setItem("tuk_enlinea", "1");
      if (!localStorage.getItem("tuk_registro")) {
        localStorage.setItem("tuk_registro", new Date().toLocaleDateString("es-CO", { day:"numeric", month:"long", year:"numeric" }));
      }
    } catch(err) { console.warn("No se pudieron guardar los datos:", err); }
    window.location.replace("inicio-conductor.html");
  });
});
 
</script>
